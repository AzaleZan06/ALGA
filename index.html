<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALGA — Divine Stillness & Worship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          try {
            var s = typeof msg === 'string' ? msg : (msg.message || msg.reason || msg.stack || JSON.stringify(msg) || String(msg));
            var lower = String(s).toLowerCase();
            return (
              lower.indexOf('metamask') !== -1 ||
              lower.indexOf('ethereum') !== -1 ||
              lower.indexOf('web3') !== -1 ||
              lower.indexOf('failed to connect to metamask') !== -1 ||
              lower.indexOf('chrome-extension://') !== -1 ||
              lower.indexOf('moz-extension://') !== -1 ||
              lower.indexOf('evmprovider') !== -1
            );
          } catch (e) {
            return false;
          }
        }

        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message) || shouldSuppress(e.filename) || shouldSuppress(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason) || (e.reason && shouldSuppress(e.reason.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
